name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
      - name: Lint (compile check)
        run: python -m compileall src bench
      - name: Tests with coverage
        run: pytest --cov=llm_output_contract --cov-report=term --cov-fail-under=85

  benchmark-gate:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: pip install -e ".[dev]"
      - name: Generate corpus and run benchmark
        run: |
          python bench/generate_corpus.py --n 5000 --out bench/corpus.jsonl --seed 7
          python bench/run_benchmark.py --corpus bench/corpus.jsonl --out bench/results/ci.json
      - name: Regression gate on recoverable-repair rate
        run: |
          python -c "import json,sys; r=json.load(open('bench/results/ci.json')); rate=r['recoverable_repair_rate']; print('recoverable_repair_rate=',rate); sys.exit(0 if rate>=0.99 else 1)"
